# Serves the already-trained models via the API and dashboard (Phase 9).
# data/processed and models/baselines are mounted read-only from the host
# -- generated by the local pipeline (see README "Reproduction"), not
# baked into the image or regenerated by these containers.
services:
  api:
    build: .
    image: aqcascade:latest
    ports:
      # Host-side 8013, not 8010: this machine runs several sibling
      # portfolio projects' Docker Compose stacks concurrently, and 8010 is
      # already claimed by another one -- the container's own internal
      # port stays 8010 (matching the app's own defaults/.env.example),
      # only the host-facing mapping changes.
      - "8013:8010"
    volumes:
      - ./data/processed:/app/data/processed:ro
      - ./models/baselines:/app/models/baselines:ro
    command: >
      uvicorn aqcascade.api.main:app
      --host 0.0.0.0 --port 8010 --app-dir /app/src
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8010/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  dashboard:
    build: .
    image: aqcascade:latest
    ports:
      - "8512:8512"
    volumes:
      - ./data/processed:/app/data/processed:ro
      - ./models/baselines:/app/models/baselines:ro
    environment:
      AQCASCADE_API_URL: http://api:8010
    command: >
      streamlit run app/streamlit/dashboard.py
      --server.port 8512 --server.address 0.0.0.0 --server.headless true
    depends_on:
      api:
        condition: service_healthy
