[project]
name = "aqcascade"
version = "0.1.0"
description = "Germany-focused short-term air-quality forecasting: does spatial context from neighboring stations improve PM2.5/NO2 prediction?"
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "numpy>=1.26,<2.0",
    "duckdb>=1.1",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "pandera[pandas]>=0.33",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "joblib>=1.4",
    "torch>=2.4",
    "torch_geometric>=2.5",
    "fastapi>=0.112",
    "uvicorn[standard]>=0.30",
    "streamlit>=1.37",
    "mlflow>=2.15",
    "prefect>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
